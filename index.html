<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重庆话正音词典</title>
    <link rel="icon" href="assets/logo-color.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/logo-color.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="重庆话正音词典首页">
        <span>CQ-Pedia</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <button type="button" id="mustReadBtn" aria-haspopup="dialog" aria-controls="mustReadModal">必读</button>
        <button type="button" id="indexBtn" aria-haspopup="dialog" aria-controls="indexModal">索引</button>
        <button type="button" id="aboutBtn" aria-haspopup="dialog" aria-controls="aboutModal">关于</button>
        <button type="button" id="feedbackBtn" aria-haspopup="dialog" aria-controls="feedbackModal">反馈</button>
      </nav>
    </header>

    <div class="modal" id="mustReadModal" role="dialog" aria-modal="true" aria-labelledby="mustReadTitle" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-window" role="document">
        <header class="modal-head">
          <h2 id="mustReadTitle">必读</h2>
          <button type="button" class="modal-close" data-modal-close aria-label="关闭">×</button>
        </header>
        <div class="modal-body">
          <aside class="doc-nav" aria-label="文档目录">
            <ul id="docList"></ul>
          </aside>
          <article class="doc-view" id="docView" tabindex="0">
            <p class="empty">载入中...</p>
          </article>
        </div>
      </div>
    </div>

    <div class="modal index-modal" id="indexModal" role="dialog" aria-modal="true" aria-labelledby="indexTitle" hidden>
      <div class="modal-backdrop" data-index-close></div>
      <div class="modal-window index-window" role="document">
        <header class="modal-head">
          <div>
            <p class="modal-kicker">Dictionary Index</p>
            <h2 id="indexTitle">索引</h2>
          </div>
          <button type="button" class="modal-close" data-index-close aria-label="关闭">×</button>
        </header>
        <div class="index-tabs" role="tablist" aria-label="索引类型">
          <button type="button" class="active" data-index-type="initial" role="tab" aria-selected="true">声母索引</button>
          <button type="button" data-index-type="wordClass" role="tab" aria-selected="false">词性索引</button>
        </div>
        <div class="initial-grid" id="initialGrid"></div>
      </div>
    </div>

    <div class="modal about-modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
      <div class="modal-backdrop" data-about-close></div>
      <div class="modal-window about-window" role="document">
        <header class="modal-head">
          <div>
            <p class="modal-kicker">About CQ-Pedia</p>
            <h2 id="aboutTitle">关于</h2>
          </div>
          <button type="button" class="modal-close" data-about-close aria-label="关闭">×</button>
        </header>
        <div class="about-content">
          <section class="about-section" aria-labelledby="authorTitle">
            <h3 id="authorTitle">作者信息</h3>
            <dl class="about-list">
              <div>
                <dt>GitHub</dt>
                <dd><a href="https://github.com/SII-Rigby" target="_blank" rel="noopener">SII-Rigby</a></dd>
              </div>
              <div>
                <dt>邮箱</dt>
                <dd>georgeliu677@gmail.com</dd>
              </div>
            </dl>
          </section>
          <section class="about-section" aria-labelledby="donateTitle">
            <h3 id="donateTitle">求打赏</h3>
            <figure class="donate-code">
              <img src="assets/donate.jpg" alt="赞赏码">
            </figure>
          </section>
        </div>
      </div>
    </div>

    <div class="modal feedback-modal" id="feedbackModal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle" hidden>
      <div class="modal-backdrop" data-feedback-close></div>
      <div class="modal-window feedback-window" role="document">
        <header class="modal-head">
          <div>
            <p class="modal-kicker">Site Feedback</p>
            <h2 id="feedbackTitle">反馈</h2>
          </div>
          <button type="button" class="modal-close" data-feedback-close aria-label="关闭">×</button>
        </header>
        <div class="feedback-tabs" role="tablist" aria-label="反馈类型">
          <button type="button" class="active" data-feedback-tab="issue" role="tab" aria-selected="true">反馈问题</button>
          <button type="button" data-feedback-tab="entry" role="tab" aria-selected="false">贡献词条</button>
        </div>
        <div class="feedback-content">
          <form class="feedback-panel active" id="issueFeedbackForm" data-feedback-panel="issue">
            <fieldset class="feedback-fieldset">
              <legend>问题类型</legend>
              <div class="choice-grid">
                <label><input type="checkbox" name="issueType" value="词条错误">词条错误</label>
                <label><input type="checkbox" name="issueType" value="网站问题">网站问题</label>
                <label><input type="checkbox" name="issueType" value="拼音/音系">拼音/音系</label>
                <label><input type="checkbox" name="issueType" value="建议">建议</label>
              </div>
            </fieldset>
            <label class="form-field">
              <span>相关词条</span>
              <input type="text" name="entryRef" autocomplete="off" placeholder="可选">
            </label>
            <label class="form-field">
              <span>联系方式</span>
              <input type="text" name="contact" autocomplete="off" placeholder="可选">
            </label>
            <label class="form-field full">
              <span>问题描述</span>
              <textarea name="message" rows="8" required></textarea>
            </label>
            <div class="form-actions">
              <button type="submit">提交</button>
            </div>
          </form>

          <form class="feedback-panel" id="entryContributionForm" data-feedback-panel="entry" hidden>
            <div class="form-grid">
              <label class="form-field">
                <span>词目</span>
                <input type="text" name="headword" required>
              </label>
              <label class="form-field">
                <span>拼音</span>
                <input type="text" name="pinyin" placeholder="xiong2 qi3" required>
              </label>
              <label class="form-field">
                <span>词性</span>
                <input type="text" name="wordClass" placeholder="名词；动词">
              </label>
              <label class="form-field">
                <span>异体写法</span>
                <input type="text" name="variants" placeholder="用 、 或 ; 分隔">
              </label>
              <label class="form-field full">
                <span>释义</span>
                <textarea name="definitions" rows="4" required placeholder="每行一条释义"></textarea>
              </label>
              <label class="form-field full">
                <span>例句</span>
                <textarea name="examples" rows="3" placeholder="每行一条例句"></textarea>
              </label>
              <label class="form-field full">
                <span>例句拼音</span>
                <textarea name="examplePinyin" rows="3" placeholder="与例句按行对应"></textarea>
              </label>
              <label class="form-field full">
                <span>例句翻译</span>
                <textarea name="exampleTranslation" rows="3" placeholder="与例句按行对应"></textarea>
              </label>
              <label class="form-field full">
                <span>备注</span>
                <textarea name="note" rows="3"></textarea>
              </label>
              <label class="form-field">
                <span>贡献者</span>
                <input type="text" name="contributor" autocomplete="off" placeholder="可选">
              </label>
              <label class="form-field">
                <span>联系方式</span>
                <input type="text" name="contact" autocomplete="off" placeholder="可选">
              </label>
            </div>
            <div class="form-actions">
              <button type="submit">提交</button>
            </div>
          </form>
          <p id="feedbackStatus" class="feedback-status" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <main>
      <section class="hero" id="search">
        <div class="hero-copy">
          <p class="platform-label">重庆语言文化开放平台</p>
          <h1>重庆话正音词典</h1>

          <form class="search-form" id="searchForm" onsubmit="window.cqSearch && window.cqSearch(); return false;">
            <label class="visually-hidden" for="searchInput">搜索词典</label>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索词目、拼音、异体写法或释义" oninput="window.cqSearch && window.cqSearch();" onchange="window.cqSearch && window.cqSearch();" onsearch="window.cqSearch && window.cqSearch();" onkeyup="window.cqSearch && window.cqSearch();">
            <button type="submit" aria-label="搜索">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
            </button>
          </form>
        </div>
      </section>

      <section class="results-panel" id="resultsPanel" aria-live="polite" hidden>
        <div class="results-head">
          <p id="resultLabel">Search results</p>
          <span id="resultCount">0</span>
        </div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span class="footer-title">
        <img class="footer-mark" src="assets/logo-color.svg" alt="" aria-hidden="true">
        <span>重庆话正音词典</span>
      </span>
      <span>CQ-Pedia</span>
    </footer>

    <script src="app.js?v=20260611-search-inline-fix"></script>
  </body>
</html>
