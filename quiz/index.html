<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重庆话测验｜CQ-Pedia</title>
    <meta name="description" content="18 道重庆话题目，测下你的言子儿水平；完成后获得专属评级。">
    <meta name="theme-color" content="#f6e8c8">
    <link rel="canonical" href="https://cqpedia.cn/quiz/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="重庆话测验｜CQ-Pedia">
    <meta property="og:description" content="18 道题，测下你的重庆话水平。">
    <meta property="og:url" content="https://cqpedia.cn/quiz/">
    <link rel="icon" href="../assets/logo-color.svg" type="image/svg+xml">
    <script>
      try {
        const savedTheme = localStorage.getItem("cq-quiz-theme");
        document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="quiz.css?v=20260804-previous-question">
    <script src="../baidu-analytics.js"></script>
    <script src="../posthog.js"></script>
    <script src="questions.js?v=20260803-1" defer></script>
    <script src="quiz.js?v=20260804-previous-question" defer></script>
  </head>
  <body>
    <header class="quiz-topbar">
      <a class="quiz-brand" href="../" aria-label="返回 CQ-Pedia 主页">
        <img src="../assets/logo-red.svg" alt="" aria-hidden="true">
        <span>CQ-Pedia</span>
      </a>
      <div class="progress-area">
        <div class="progress-meta">
          <span id="progressLabel">重庆话测验</span>
          <strong id="progressCount">准备中</strong>
        </div>
        <div class="progress-track" id="progressTrack" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="18" aria-valuenow="0">
          <span class="progress-fill" id="progressFill"></span>
        </div>
      </div>
      <div class="quiz-tools">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换夜间模式" aria-pressed="false" title="切换夜间模式">
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.4A8.5 8.5 0 0 1 8.6 4a8.5 8.5 0 1 0 11.4 11.4Z"></path></svg>
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </button>
        <a class="quiz-exit" href="../" aria-label="退出测验，返回主页" title="返回主页">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </a>
      </div>
    </header>

    <main class="quiz-shell" id="quizShell">
      <section class="question-card" id="questionCard" aria-labelledby="questionTitle">
        <div class="question-heading">
          <div class="level-row">
            <span class="level-badge" id="levelBadge">载入中</span>
            <span class="question-kind" id="questionKind"></span>
          </div>
          <h1 id="questionTitle">题目正在上山……</h1>
          <p class="question-hint" id="questionHint"></p>
        </div>

        <div class="answer-area" id="answerArea" aria-live="polite"></div>

        <div class="question-action">
          <button class="previous-action" type="button" id="previousBtn" disabled>← 上一题</button>
          <button class="primary-action" type="button" id="actionBtn" disabled>确认答案</button>
        </div>
      </section>

      <section class="result-card" id="resultCard" aria-labelledby="resultTitle" hidden></section>
    </main>

    <div class="quiz-toast" id="quizToast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <p class="noscript-card">重庆话测验需要启用 JavaScript 才能答题。</p>
    </noscript>
  </body>
</html>
